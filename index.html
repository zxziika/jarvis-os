<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="description" content="Személyes irányítóközpont. Feladatok, tanulás és napi napló, saját eszközödön.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>JARVIS OS · Személyes irányítóközpont</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="#main" class="skip">Ugrás a tartalomhoz</a>
  <aside id="sidebar" aria-label="Főmenü"></aside>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="JARVIS kezdőlap"><span class="brandmark">J</span><span>JARVIS <b>OS</b><small>PERSONAL OPERATING SYSTEM</small></span></a>
      <div class="top-actions"><span id="connection" class="connection">Betöltés</span><button class="icon-button" data-action="search" aria-label="Keresés" id="search-button"></button><button class="avatar" data-nav="settings" aria-label="Beállítások">J</button></div>
    </header>
    <div id="error" class="banner danger" role="alert" hidden></div>
    <div id="update" class="banner" hidden>Új verzió készen áll. Mentsd a nyitott űrlapot, majd frissíts. <button data-action="apply-update">Frissítés</button></div>
    <main id="main" tabindex="-1"><div class="loading"><span class="pulse"></span> Saját adataid betöltése…</div></main>
    <footer class="page-footer"><span>JARVIS OS <span id="version"></span></span><span id="save-state">Adatok az eszközödön</span></footer>
  </div>
  <nav id="bottom-nav" aria-label="Mobil főmenü"></nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>A JARVIS OS használatához engedélyezd a JavaScriptet a Safari beállításaiban.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
